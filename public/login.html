<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | 北京校园生态合作联盟</title>
  <meta name="description" content="登录北京校园生态合作联盟账号，查看您的申请和报名状态。">
  <meta property="og:title" content="登录 | 北京校园生态合作联盟">
  <meta property="og:description" content="登录北京校园生态合作联盟账号，查看您的申请和报名状态。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="assets/runtime-mode.js"></script>
  <script>
    (function () {
      var script = document.createElement("script");
      script.src = window.location.protocol === "file:" ? "assets/bootstrap.js" : "assets/bootstrap.js";
      script.onload = function () { window.AllianceBootstrap.initHead(); };
      document.head.appendChild(script);
    })();
  </script>
  <style>
    :root {
}
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(1200px 800px at 70% -10%, rgba(79, 185, 156, 0.18), transparent),
                  radial-gradient(900px 600px at -10% 60%, rgba(79, 185, 156, 0.15), transparent),
                  var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(8px);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header h1 {
      font-size: 26px;
      margin: 0 0 8px;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-header p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 15px;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 185, 156, 0.15);
    }
    .form-group input::placeholder {
      color: rgba(159, 179, 208, 0.5);
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input {
      padding-right: 44px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      font-size: 18px;
    }
    .toggle-password:hover {
      color: var(--text);
    }
    .input-error {
      border-color: #ef4444 !important;
    }
    .error-message {
      color: #fca5a5;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
    }
    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    .forgot-link {
      color: var(--accent);
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(79, 185, 156, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .notice {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .notice.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .notice.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .back-link {
      position: absolute;
      top: 24px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }
    @media (max-width: 480px) {
      .auth-card {
        padding: 32px 24px;
      }
      .back-link {
        position: static;
        margin-bottom: 16px;
        display: inline-flex;
      }
    }
    .demo-hint {
      margin: 0 0 18px;
      padding: 14px 16px;
      border: 1px solid rgba(79, 185, 156, 0.28);
      border-radius: 12px;
      background: rgba(79, 185, 156, 0.08);
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }
    .demo-hint[hidden] { display: none !important; }
    .demo-hint strong { display:block; color: var(--text); font-weight: 500; margin-bottom: 10px; }
    .demo-accounts { display: flex; flex-wrap: wrap; gap: 8px; }
    .demo-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .demo-chip:hover { background: rgba(79, 185, 156, 0.16); border-color: rgba(79, 185, 156, 0.45); }
    .demo-role { color: var(--accent); }
    .demo-id { font-family: var(--mono, monospace); }
    .demo-pwd { color: var(--muted); font-family: var(--mono, monospace); }
    .demo-note { margin: 10px 0 0; font-size: 12px; opacity: .78; }
  </style>
  <link rel="stylesheet" href="assets/design-tokens.css">
    <link rel="stylesheet" href="assets/brand-layer.css">
  </head>
<body>
  <a href="index.html" class="back-link" id="backHomeLink">← 返回首页</a>
  
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>欢迎回来</h1>
        <p>登录您的联盟账号</p>
      </div>

      <div class="notice" id="notice"></div>

      <div class="demo-hint" id="demoHint" hidden>
        <strong>当前为演示模式（未检测到后端服务）</strong>
        <div class="demo-accounts">
          <button type="button" class="demo-chip" data-email="gly" data-pwd="demo2026">
            <span class="demo-role">管理员</span>
            <span class="demo-id">gly</span>
            <span class="demo-pwd">demo2026</span>
          </button>
          <button type="button" class="demo-chip" data-email="test@alliance.local" data-pwd="demo2026">
            <span class="demo-role">普通用户</span>
            <span class="demo-id">test@alliance.local</span>
            <span class="demo-pwd">demo2026</span>
          </button>
        </div>
        <p class="demo-note">点击任一账号自动填入。这些是公开的演示凭据，只在本地或静态托管下生效，不会影响正式服务。</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">邮箱或昵称</label>
          <input type="text" id="email" name="email" placeholder="请输入邮箱或昵称" required>
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
            <button type="button" class="toggle-password" id="togglePassword" title="显示/隐藏密码">👁</button>
          </div>
          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>记住我</span>
          </label>
          <a href="forgot-password.html" class="forgot-link" id="forgotPasswordLink">忘记密码？</a>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">登录</button>
      </form>

      <div class="auth-footer">
        还没有账号？<a href="register.html" id="registerLink">立即注册</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 运行形态由 AllianceRuntime 判定：file:// 与"探测不到后端"（GitHub Pages 静态托管）
      // 都属于离线演示模式，走 localStorage 分支；只有真实 Node 服务才打 API。
      // 原来只看协议，导致静态托管下把请求打到站点根目录的 /api → 404。
      let IS_FILE_MODE = window.location.protocol === 'file:';
      let API_BASE = IS_FILE_MODE ? 'http://localhost:3000/api' : 'api';
      const MY_PAGE = 'my.html';
      const ADMIN_PAGE = 'admin.html';
      const HOME_PAGE = 'index.html';

      async function ensureMode() {
        if (window.AllianceRuntime) {
          await window.AllianceRuntime.whenReady();
          IS_FILE_MODE = window.AllianceRuntime.isOffline();
          API_BASE = window.AllianceRuntime.apiBase();
        } else {
          IS_FILE_MODE = window.location.protocol === 'file:';
        }
        return IS_FILE_MODE;
      }
      const REGISTER_PAGE = 'register.html';
      const FORGOT_PASSWORD_PAGE = 'forgot-password.html';
      // 本地演示账号的密码不再写死在代码里：首次使用时由使用者在自己的电脑上设定，
      // 只保存在本浏览器的 localStorage，不会提交到任何服务器。
      const LOCAL_PASSWORD_KEY = 'alliance_local_demo_password';
      function localDemoPassword() {
        let pwd = localStorage.getItem(LOCAL_PASSWORD_KEY);
        if (!pwd) {
          pwd = window.prompt('本地演示模式：请为这台电脑设置一个本地密码（仅保存在此浏览器，不会上传）');
          if (!pwd) return null;
          localStorage.setItem(LOCAL_PASSWORD_KEY, pwd);
        }
        return pwd;
      }

      // 演示密码校验：固定演示密码开箱即用；使用者自设的本地密码同样有效。
      // 这里只读 localStorage，不触发 prompt，避免每次登录都弹窗。
      function demoPasswordOk(input) {
        if (!input) return false;
        if (input === DEMO_PASSWORD) return true;
        try {
          const saved = localStorage.getItem(LOCAL_PASSWORD_KEY);
          return !!saved && input === saved;
        } catch (e) {
          return false;
        }
      }
      // 演示账号：仅在"探测不到后端"的离线演示模式下生效，绝不会影响真实后端的登录。
      // 密码公开可见是有意为之——静态演示站没有服务端，这个凭据不具备任何真实权限；
      // 同时邮箱一律使用保留域名 .local，避免与真实账号撞车。
      const DEMO_PASSWORD = 'demo2026';
      const LOCAL_TEST_ACCOUNT = {
        email: 'test@alliance.local',
        password: null,
        user: {
          id: 10001,
          userId: 10001,
          email: 'test@alliance.local',
          nickname: '测试用户',
          real_name: '测试用户',
          org_name: '北京校园生态合作联盟',
          org_role: '测试账号',
          isAdmin: false,
          created_at: new Date().toISOString()
        }
      };
      const LOCAL_SUPER_ADMIN = {
        email: 'gly',
        password: null,
        user: {
          id: 90001,
          userId: 90001,
          email: 'gly@alliance.local',
          nickname: 'gly',
          real_name: '超级管理员',
          org_name: '北京校园生态合作联盟',
          org_role: '超级管理员',
          isAdmin: true,
          created_at: new Date().toISOString()
        }
      };

      document.getElementById('backHomeLink').href = HOME_PAGE;
      document.getElementById('registerLink').href = REGISTER_PAGE;
      document.getElementById('forgotPasswordLink').href = FORGOT_PASSWORD_PAGE;

      let csrfToken = '';
      async function ensureCsrfToken() {
        if (IS_FILE_MODE) return '';
        if (csrfToken) return csrfToken;
        const res = await fetch(`${API_BASE}/csrf-token`, { method: 'GET' });
        const data = await res.json();
        csrfToken = data && data.success ? (data.csrfToken || '') : '';
        return csrfToken;
      }
      
      // 检查是否已登录
      const token = localStorage.getItem('alliance_token');
      if (token) {
        if (IS_FILE_MODE) {
          window.location.href = MY_PAGE;
          return;
        }
        // 验证 token 是否有效
        fetch(`${API_BASE}/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            // 已登录，跳转到用户中心
            window.location.href = MY_PAGE;
          }
        })
        .catch(() => {
          // token 无效，清除
          localStorage.removeItem('alliance_token');
          localStorage.removeItem('alliance_user');
        });
      }

      // 演示模式提示：探测不到后端时展示可一键填入的演示账号
      const demoHint = document.getElementById('demoHint');
      if (demoHint) {
        demoHint.querySelectorAll('.demo-chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            document.getElementById('email').value = chip.getAttribute('data-email') || '';
            document.getElementById('password').value = chip.getAttribute('data-pwd') || '';
            document.getElementById('email').classList.remove('input-error');
            document.getElementById('password').classList.remove('input-error');
            document.getElementById('emailError').classList.remove('show');
            document.getElementById('passwordError').classList.remove('show');
          });
        });
        ensureMode().then(function (offline) {
          demoHint.hidden = !offline;
        });
      }

      // 自动填充记住的邮箱
      const rememberedEmail = localStorage.getItem('rememberedEmail');
      if (rememberedEmail) {
        document.getElementById('email').value = rememberedEmail;
      }

      // 密码显示/隐藏
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      let passwordVisible = false;

      togglePassword.addEventListener('click', function() {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        togglePassword.textContent = passwordVisible ? '🙈' : '👁';
      });

      // 实时验证
      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');

      function validateEmail() {
        const value = emailInput.value.trim();
        if (!value) {
          emailInput.classList.add('input-error');
          emailError.textContent = '请输入账号';
          emailError.classList.add('show');
          return false;
        }
        emailInput.classList.remove('input-error');
        emailError.classList.remove('show');
        return true;
      }

      function validatePassword() {
        const value = passwordInput.value;
        if (!value) {
          passwordInput.classList.add('input-error');
          passwordError.textContent = '请输入密码';
          passwordError.classList.add('show');
          return false;
        }
        if (value.length < 8) {
          passwordInput.classList.add('input-error');
          passwordError.textContent = '密码长度至少 8 位';
          passwordError.classList.add('show');
          return false;
        }
        passwordInput.classList.remove('input-error');
        passwordError.classList.remove('show');
        return true;
      }

      emailInput.addEventListener('blur', validateEmail);
      passwordInput.addEventListener('blur', validatePassword);

      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // 提交前先确认运行形态：有后端打 API，没有后端走本地演示账号。
        await ensureMode();

        // 验证
        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();
        
        if (!isEmailValid || !isPasswordValid) {
          return;
        }
        
        const submitBtn = document.getElementById('submitBtn');
        const notice = document.getElementById('notice');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';
        notice.className = 'notice';

        try {
          if (IS_FILE_MODE) {
            const pwdOk = demoPasswordOk(password);
            if (email === LOCAL_SUPER_ADMIN.email && pwdOk) {
              localStorage.setItem('alliance_token', 'local-admin-token');
              localStorage.setItem('alliance_user', JSON.stringify(LOCAL_SUPER_ADMIN.user));

              if (rememberMe) {
                localStorage.setItem('rememberedEmail', email);
              } else {
                localStorage.removeItem('rememberedEmail');
              }

              notice.className = 'notice success';
              notice.textContent = '超级管理员登录成功，正在进入后台...';
              setTimeout(() => {
                // 演示管理员直接进后台界面；正式服务的管理员仍走用户中心再进后台
                window.location.href = IS_FILE_MODE ? ADMIN_PAGE : MY_PAGE;
              }, 300);
              return;
            }

            if (email === LOCAL_TEST_ACCOUNT.email && pwdOk) {
              localStorage.setItem('alliance_token', 'local-user-token');
              localStorage.setItem('alliance_user', JSON.stringify(LOCAL_TEST_ACCOUNT.user));

              if (rememberMe) {
                localStorage.setItem('rememberedEmail', email);
              } else {
                localStorage.removeItem('rememberedEmail');
              }

              notice.className = 'notice success';
              notice.textContent = '登录成功，正在跳转...';
              setTimeout(() => {
                window.location.href = MY_PAGE;
              }, 300);
              return;
            }

            notice.className = 'notice error';
            notice.textContent = '演示模式：管理员账号 gly，普通账号 test@alliance.local，密码 ' + DEMO_PASSWORD;
            return;
          }

          const requestBody = JSON.stringify({ email, password });

          let res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRF-Token': await ensureCsrfToken()
            },
            body: requestBody
          });

          // CSRF 403 时刷新 token 重试一次
          if (res.status === 403) {
            csrfToken = '';
            res = await fetch(`${API_BASE}/auth/login`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': await ensureCsrfToken()
              },
              body: requestBody
            });
          }
          
          const data = await res.json();
          
          if (data.success) {
            // 保存登录状态
            localStorage.setItem('alliance_token', data.token);
            localStorage.setItem('alliance_user', JSON.stringify(data.user));
            
            // 记住邮箱
            if (rememberMe) {
              localStorage.setItem('rememberedEmail', email);
            } else {
              localStorage.removeItem('rememberedEmail');
            }

            notice.className = 'notice success';
            notice.textContent = '登录成功，正在跳转...';
            
            setTimeout(() => {
              window.location.href = MY_PAGE;
            }, 500);
          } else {
            notice.className = 'notice error';
            notice.textContent = data.message || '登录失败';
          }
        } catch (err) {
          notice.className = 'notice error';
          notice.textContent = '网络错误，请稍后重试';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '登录';
        }
      });
    })();
  </script>
<script>
  (function loadNavAuth() {
    if (window.AllianceBootstrap && window.AllianceBootstrap.loadScript) {
      window.AllianceBootstrap.loadScript("assets/nav-auth.js?v=202604201933");
      return;
    }
    var script = document.createElement("script");
    script.src = window.location.protocol === "file:"
      ? "assets/nav-auth.js?v=202604201933"
      : "assets/nav-auth.js?v=202604201933";
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
