name: Pages

# 站点实际部署在 Render（见 render.yaml），日常部署不走这个 workflow。
# 这里保留的是"无后端的静态演示站"发布能力：
# 仓库没有启用 Pages 时 workflow 会失败，所以改为仅手动触发，不在每次 push 时跑。
#
# 使用前需要两步：
#   1. 仓库 Settings → Pages → Source 选 "GitHub Actions"
#   2. 在 Actions 页手动触发本 workflow
# 发布地址：https://voskamp099.github.io/campus-ecosystem-network/
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署静态站点到 GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时自动开启（需要 token 具备 pages 写权限）。
          # 若仓库策略禁止自动开启，去 Settings → Pages 把 Source 设为 GitHub Actions 即可。
          enablement: true

      - name: 关闭 Jekyll 处理
        run: touch public/.nojekyll

      # 产物自检：避免把一个空壳站点发上线
      - name: 检查站点产物
        run: |
          set -e
          test -f public/index.html || { echo "缺少 public/index.html"; exit 1; }
          test -f public/assets/runtime-mode.js || { echo "缺少 runtime-mode.js（静态形态的运行模式判定依赖它）"; exit 1; }
          echo "产物检查通过，共 $(find public -type f | wc -l | tr -d ' ') 个文件"

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
